# iOS uygulamasını GitHub'ın Mac bilgisayarlarında derler ve test eder.
# Özel (private) depoda macOS dakikaları ücretsiz kotadan 10 kat düşer
# (ayda ~200 dakika); bu yüzden yalnızca ios/ değişince çalışır.
name: iOS

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel Mac: GitHub'ın Apple çipli (arm64) Mac'lerinde yoğunluk var; işler
    # 15 dakika sırada bekleyip iptal oluyordu. Açık depoda bu da ücretsiz.
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Seçilen: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Xcode projesini üret
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: Testleri çalıştır (simülatör)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in data[k] if d["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -project TravelApp.xcodeproj -scheme TravelApp \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: İmzasız .ipa üret
        run: |
          xcodebuild build \
            -project TravelApp.xcodeproj -scheme TravelApp \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TravelApp.app Payload/
          zip -qry TravelApp-imzasiz.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TravelApp-imzasiz-ipa
          path: ios/TravelApp-imzasiz.ipa
          retention-days: 7
