# Her ekranın iPhone simülatöründe ekran görüntüsünü alır ve
# "ekran-goruntuleri" dalına koyar (tasarımla karşılaştırmak için).
# macOS dakikası harcamamak için yalnızca commit mesajında "[ekran]"
# geçen gönderimlerde ya da elle başlatılınca çalışır.
name: Ekran görüntüleri

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      screens:
        description: "Yalnızca bu ekranlar, boşlukla ayrılmış (boşsa hepsi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ekran]')
    # İşin içinde: "[ekran]" olmayan bir gönderim (iş atlanır) süren
    # çekimi iptal etmesin; yalnızca yeni bir çekim eskisini keser.
    concurrency:
      group: screenshots
      cancel-in-progress: true
    # Intel Mac: GitHub'ın Apple çipli (arm64) Mac'lerinde yoğunluk var; işler
    # 15 dakika sırada bekleyip iptal oluyordu. Açık depoda bu da ücretsiz.
    runs-on: macos-15-intel
    # Google haritalı 44 ekran ~45 dakika sürüyor.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Xcode projesini üret
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: Simülatör için derle
        env:
          # Google haritası ekran görüntülerinde de görünsün.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          names = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16"]
          devices = [d for k in ios for d in data[k] if d["name"].startswith("iPhone")]
          best = next((d for n in names for d in devices if d["name"] == n), devices[0])
          print(best["udid"])
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project TravelApp.xcodeproj -scheme TravelApp \
            -configuration Debug -destination "id=$DEVICE_ID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Ekranları çek
        env:
          ONLY: ${{ inputs.screens }}
        run: |
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl location "$DEVICE_ID" set 35.7148,139.7967 || true
          APP=build/Build/Products/Debug-iphonesimulator/TravelApp.app
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl privacy "$DEVICE_ID" grant location io.travelapp.ios || true
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          # simctl bazen takılıyor (bir kez 26 dk bekledi); her komut için süre sınırı.
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # Yeni açılan simülatör ilk dakikalarda çok yavaş (açılış 60 sn'yi aşıyor,
          # ekran beyaz kalıyor); önce birkaç kez açıp ısıt.
          for warm in home sheetTall city; do
            t 60 xcrun simctl terminate "$DEVICE_ID" io.travelapp.ios 2>/dev/null || true
            t 180 xcrun simctl launch "$DEVICE_ID" io.travelapp.ios -screen "$warm" -appLanguage tr -AppleLanguages "(tr)" -AppleLocale tr_TR || true
            sleep 25
          done
          shoot() {
            screen="$1"; file="$2"
            t 60 xcrun simctl terminate "$DEVICE_ID" io.travelapp.ios 2>/dev/null || true
            # Görüntüler Türkçe (Oguz istemedikçe); "english" yalnızca İngilizce denetimi için.
            LANG_ARGS=(-appLanguage tr -AppleLanguages "(tr)" -AppleLocale tr_TR)
            EXTRA=()
            case "$screen" in
              english) LANG_ARGS=(-appLanguage en -AppleLanguages "(en)" -AppleLocale en_US) ;;
              pins) EXTRA=(-pinStyle photo) ;;
            esac
            t 120 xcrun simctl launch "$DEVICE_ID" io.travelapp.ios -screen "$screen" "${LANG_ARGS[@]}" "${EXTRA[@]}" \
              || t 120 xcrun simctl launch "$DEVICE_ID" io.travelapp.ios -screen "$screen" "${LANG_ARGS[@]}" "${EXTRA[@]}" \
              || echo "açılmadı: $screen"
            # Yol tarifi, Keşfet ve fotoğraflı sayfalar içeriği internetten bulur; biraz daha bekle.
            case "$screen" in
              guide|continent|country|cityGuide|addToPlan|journey|discover|discoverTall|collections|collection|saveTo|add|addSearch|pins|city|sheetTall|sheet|googlePlace|googleTall|map) sleep 14 ;;
              *) sleep 8 ;;
            esac
            t 60 xcrun simctl io "$DEVICE_ID" screenshot "$file" || echo "çekilemedi: $screen"
          }
          i=1
          SCREENS="home settings map sheet sheetTall googlePlace googleTall photo pins city cityTall all spot listen player guide moved movedList saved downloads place walk add addSearch import camera custom trips journey flight stay addCity newTrip discover discoverTall collections newCollection collection saveTo continent country cityGuide addToPlan english"
          [ -n "$ONLY" ] && SCREENS="$ONLY"
          for screen in $SCREENS; do
            shoot "$screen" "$OUT/$(printf '%02d' $i)-$screen.png"
            i=$((i+1))
          done
          # Beyaz kalan (uygulama henüz çizilmemiş, ~80 KB) ya da hiç çekilemeyen
          # ekranları bir kez daha çek.
          i=1
          for screen in $SCREENS; do
            file="$OUT/$(printf '%02d' $i)-$screen.png"
            if [ ! -s "$file" ] || [ "$(stat -f %z "$file")" -lt 120000 ]; then
              echo "yeniden çekiliyor: $screen"
              shoot "$screen" "$file"
            fi
            i=$((i+1))
          done
          ls -la "$OUT"

      - name: Görüntüleri dala koy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ekran-goruntuleri
          git add .
          git commit -qm "Ekran görüntüleri: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ekran-goruntuleri
