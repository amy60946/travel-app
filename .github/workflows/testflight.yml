# Uygulamayı imzalayıp TestFlight'a yükler. Elle başlatılır:
# GitHub → Actions → TestFlight → Run workflow.
# Gerekli GitHub Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID
# (nasıl alınacağı: docs/GELISTIRME.md → TestFlight).
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # İsteğe bağlı: fotoğraftan ve yazıdan yer bulmada ücretsiz bulut
      # yapay zekâlar (boş olan kapalı kalır).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Seçilen: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Gizli bilgiler girilmiş mi?
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets'ta eksik:$missing (bkz. docs/GELISTIRME.md)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Xcode projesini üret
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: Arşivle (imzalı)
        run: |
          xcodebuild archive \
            -project TravelApp.xcodeproj -scheme TravelApp \
            -configuration Release -destination generic/platform=iOS \
            -archivePath build/TravelApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: TestFlight'a yükle
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/TravelApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: İmza bilgisi (yükleme başarısızsa)
        if: failure()
        run: |
          echo "== Arşivdeki imza"
          codesign -dvv build/TravelApp.xcarchive/Products/Applications/TravelApp.app 2>&1 | grep -E "Authority|TeamIdentifier|Identifier" || true
          security find-identity -v -p codesigning || true
          for dir in "${TMPDIR:-/tmp}"/TravelApp_*.xcdistributionlogs; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            ls "$dir"
            grep -h -i -E "signing identity|certificate|codesign|profile|cloud|managed|error" "$dir"/*.log 2>/dev/null | cut -c1-400 | head -150 || true
          done

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
