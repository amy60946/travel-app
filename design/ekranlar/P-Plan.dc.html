<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tokyo planı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#222222;text-decoration:none}a:hover{color:#222222}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #F2F0EB; color: #222222; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">
<svg aria-hidden="true" width="390" height="460" viewBox="0 0 390 460" style="position: absolute; left: 0; top: 0">
<rect x="116" y="216" width="48" height="48" rx="8" fill="#DCE8D2"></rect>
<path d="M362 0 C 352 160, 380 300, 358 460 L 390 460 L 390 0 Z" fill="#C9DDE6"></path>
<g stroke="#FFFFFF">
<line x1="20" y1="0" x2="20" y2="460" stroke-width="5"></line>
<line x1="60" y1="0" x2="60" y2="460" stroke-width="5"></line>
<line x1="110" y1="0" x2="110" y2="460" stroke-width="5"></line>
<line x1="170" y1="0" x2="170" y2="460" stroke-width="5"></line>
<line x1="230" y1="0" x2="230" y2="460" stroke-width="10"></line>
<line x1="290" y1="0" x2="290" y2="460" stroke-width="5"></line>
<line x1="340" y1="0" x2="340" y2="460" stroke-width="5"></line>
<line x1="0" y1="150" x2="390" y2="150" stroke-width="5"></line>
<line x1="0" y1="210" x2="390" y2="210" stroke-width="5"></line>
<line x1="0" y1="270" x2="390" y2="270" stroke-width="10"></line>
<line x1="0" y1="330" x2="390" y2="330" stroke-width="5"></line>
<line x1="0" y1="390" x2="390" y2="390" stroke-width="5"></line>
</g>
<path d="M290 150 V210 H110 V330 H60 M60 330 V390 H230 V270" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M290 150 V210 H110 V330 H60 M60 330 V390 H230 V270" fill="none" stroke="#C94A2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="3">
<span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; transform: translate(-17px, -50%); height: 34px; padding: 0 12px 0 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.16)"><span style="width: 34px; height: 34px; border-radius: 17px; background: #222222; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px">{{p.n}}</span>{{p.label}}</span>
</sc-for>
<div style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; align-items: center; justify-content: space-between">
<a href="P-Ana.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 3px 10px rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<span style="height: 44px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 3px 10px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 15px; font-weight: 700; line-height: 1.2">Tokyo</span><span style="font-size: 12px; color: #6A6A6A; line-height: 1.2">{{range}}</span></span>
<button type="button" aria-label="Harita türü" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #222222; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 3px 10px rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
</button>
</div>
<div style="position: absolute; left: 0; right: 0; top: 430px; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.1); display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #DDDDDD; margin-top: 10px"></span>
<div style="padding: 12px 20px 8px; display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 18px; background: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v10h12V10"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Gezi başlıyor</span><span style="font-size: 13px; color: #6A6A6A">Sal 27 Eki · Normal tempo</span></span>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{minus}}" aria-label="Bir gün azalt" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #B0B0B0; background: #FFFFFF; font: inherit; font-size: 18px; color: #222222; cursor: pointer">−</button>
<span style="display: flex; flex-direction: column; align-items: center; min-width: 30px"><span style="font-size: 17px; font-weight: 700; line-height: 1.1">{{days}}</span><span style="font-size: 11px; color: #6A6A6A">gün</span></span>
<button type="button" onClick="{{plus}}" aria-label="Bir gün artır" style="width: 32px; height: 32px; border-radius: 16px; border: 1px solid #B0B0B0; background: #FFFFFF; font: inherit; font-size: 18px; color: #222222; cursor: pointer">+</button>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 110px; display: flex; flex-direction: column">
<sc-for list="{{dayList}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 30px">
<a href="P-YerEkle.dc.html" aria-label="Buraya yer ekle" style="width: 24px; height: 24px; margin-left: 6px; border-radius: 12px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #6A6A6A">+</a>
<span style="font-size: 13px; color: #6A6A6A">{{d.gap}}</span>
</div>
<a href="N-Rota.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 10px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.06), 0 6px 14px rgba(0,0,0,0.08)">
<span style="position: relative; width: 56px; height: 56px; flex: none; border-radius: 10px; background: {{d.photo}}"><span style="position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 11px; background: #222222; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{d.n}}</span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{d.title}}</span><span style="font-size: 13px; color: #6A6A6A">{{d.sub}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
<div style="display: flex; align-items: center; gap: 12px; padding-top: 14px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 18px; background: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Gezi bitiyor</span><span style="font-size: 13px; color: #6A6A6A">{{lastDate}}</span></span>
</div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(rgba(255,255,255,0), #FFFFFF 45%)"></div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Ekle" style="position: absolute; right: 16px; bottom: 100px; width: 260px; padding: 6px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 8px 28px rgba(0,0,0,0.2); display: flex; flex-direction: column">
<a role="menuitem" href="P-YerEkle.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Yer ekle</a>
<a role="menuitem" href="P-Koleksiyon.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>Kayıtlarından ekle</a>
<a role="menuitem" href="P-OzelYer.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><path d="M12 7v5M9.5 9.5h5"></path></svg>Kendi yerini oluştur</a>
<a role="menuitem" href="P-Ana.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V9l5-3v15"></path><path d="M10 21V4l9 4v13"></path></svg>Şehir ekle</a>
<a role="menuitem" href="N-Plan.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3"></path><path d="M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4"></path><path d="M6 21v-4h4"></path></svg>Rotayı yeniden düzenle</a>
</div>
</sc-if>
<div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; justify-content: space-between">
<span style="width: 56px"></span>
<div role="tablist" aria-label="Mod" style="display: grid; grid-template-columns: 1fr 1fr; width: 200px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.06), 0 6px 14px rgba(0,0,0,0.08)">
<span role="tab" aria-selected="true" style="height: 40px; border-radius: 999px; background: #222222; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Planla</span>
<a role="tab" aria-selected="false" href="P-Yuruyus.dc.html" style="height: 40px; border-radius: 999px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Yürü</a>
</div>
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-label="Ekle" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #222222; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.25)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="transform: {{plusRot}}"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const days = s.days || 3;
    const open = !!s.menu;
    const dates = ['Sal 27 Eki', 'Çar 28 Eki', 'Per 29 Eki', 'Cum 30 Eki', 'Cmt 31 Eki'];
    const pool = [
      { title: 'Asakusa ve Ueno', sub: '5 yer · 4,2 km yürüyüş', photo: '#9B3A2A', gap: 'Otelden 12 dk' },
      { title: 'Shibuya ve Harajuku', sub: '6 yer · 5,1 km yürüyüş', photo: '#3A4258', gap: 'Metroyla 25 dk' },
      { title: 'Tsukiji ve Ginza', sub: '5 yer · 3,8 km yürüyüş', photo: '#A2452E', gap: 'Metroyla 18 dk' },
      { title: 'Yanaka ve Nezu', sub: '4 yer · 3,1 km yürüyüş', photo: '#6B6A4A', gap: 'Metroyla 20 dk' },
      { title: 'Shimokitazawa', sub: '4 yer · 2,6 km yürüyüş', photo: '#7D6B55', gap: 'Trenle 15 dk' }
    ];
    return {
      days: days,
      minus: () => this.setState({ days: Math.max(1, days - 1) }),
      plus: () => this.setState({ days: Math.min(5, days + 1) }),
      range: days === 1 ? '27 Eki' : '27–' + (26 + days) + ' Eki',
      lastDate: dates[days - 1],
      dayList: pool.slice(0, days).map((d, i) => ({ ...d, n: i + 1, sub: dates[i] + ' · ' + d.sub })),
      pins: [
        { n: 1, label: 'Asakusa', x: 290, y: 150 },
        { n: 2, label: 'Shibuya', x: 60, y: 330 },
        { n: 3, label: 'Ginza', x: 230, y: 270 }
      ].slice(0, Math.max(1, Math.min(3, days))),
      menuOpen: open,
      plusRot: open ? 'rotate(45deg)' : 'none',
      toggleMenu: () => this.setState({ menu: !open })
    };
  }
}
</script>
</body>
</html>
