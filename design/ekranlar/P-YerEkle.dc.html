<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yer ekle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#222222;text-decoration:none}a:hover{color:#222222}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #8C8B87; color: #222222; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 50px; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
<div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: 40px 1fr 40px; align-items: center">
<a href="P-Plan.dc.html" aria-label="Kapat" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="text-align: center; font-size: 17px; font-weight: 700">Yer ekle</span>
<span></span>
</div>
<label style="height: 52px; padding: 0 18px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.06), 0 6px 14px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="text" placeholder="Yer, restoran veya kafe ara" aria-label="Yer ara" style="flex: 1; border: none; outline: none; font: inherit; font-size: 16px; color: #222222; background: transparent">
</label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<a href="P-OzelYer.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid #DDDDDD; font-size: 14px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><path d="M12 7v5M9.5 9.5h5"></path></svg>Kendi yerini oluştur</a>
<a href="N-Kamera.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid #DDDDDD; font-size: 14px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Fotoğrafla ekle</a>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px">Kayıtlarından</h2>
<a href="P-Koleksiyon.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: underline">Tümü (34)</a>
</div>
<sc-for list="{{saved}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
<span style="width: 52px; height: 52px; flex: none; border-radius: 10px; background: {{r.photo}}"></span>
<a href="P-Yer.dc.html" style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: #6A6A6A">{{r.cat}}</span><span style="font-size: 16px; font-weight: 700">{{r.name}}</span><span style="font-size: 13px; color: #6A6A6A">{{r.area}}</span></a>
<button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.on}}" aria-label="{{r.aria}}" style="width: 34px; height: 34px; flex: none; border-radius: 17px; cursor: pointer; font: inherit; font-size: 18px; display: flex; align-items: center; justify-content: center; border: {{r.border}}; background: {{r.bg}}; color: {{r.fg}}">{{r.mark}}</button>
</div>
</sc-for>
<div style="height: 1px; background: #EBEBEB; margin: 10px 0"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px">Popüler yerler</h2>
<span style="font-size: 13px; color: #6A6A6A">Tokyo'da en çok okunan yerler</span>
</div>
<sc-for list="{{popular}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
<span style="width: 52px; height: 52px; flex: none; border-radius: 10px; background: {{r.photo}}"></span>
<a href="P-Yer.dc.html" style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: #6A6A6A">{{r.cat}}</span><span style="font-size: 16px; font-weight: 700">{{r.name}}</span><span style="font-size: 13px; color: #6A6A6A">{{r.area}}</span></a>
<button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.on}}" aria-label="{{r.aria}}" style="width: 34px; height: 34px; flex: none; border-radius: 17px; cursor: pointer; font: inherit; font-size: 18px; display: flex; align-items: center; justify-content: center; border: {{r.border}}; background: {{r.bg}}; color: {{r.fg}}">{{r.mark}}</button>
</div>
</sc-for>
<span style="font-size: 12px; color: #6A6A6A; padding-top: 8px">Bilgiler: Apple Haritalar · Açıklamalar: Wikipedia, Wikivoyage</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sel = s.sel || { sensoji: true };
    const row = (r) => {
      const on = !!sel[r.id];
      return { ...r, on: on, mark: on ? '✓' : '+', aria: on ? r.name + ' rotada, çıkar' : r.name + ' rotaya ekle', bg: on ? '#222222' : '#FFFFFF', fg: on ? '#FFFFFF' : '#222222', border: on ? '1px solid #222222' : '1px solid #B0B0B0', toggle: () => this.setState({ sel: { ...sel, [r.id]: !on } }) };
    };
    return {
      saved: [
        { id: 'ichiran', cat: 'RAMEN · INSTAGRAM', name: 'Ichiran Shibuya', area: 'Shibuya, Tokyo', photo: '#8A4B2E' },
        { id: 'fuglen', cat: 'KAFE · TIKTOK', name: 'Fuglen Tokyo', area: 'Tomigaya, Tokyo', photo: '#6B5A48' },
        { id: 'onibus', cat: 'KAFE · INSTAGRAM', name: 'Onibus Coffee', area: 'Nakameguro, Tokyo', photo: '#7D6B55' }
      ].map(row),
      popular: [
        { id: 'sensoji', cat: 'TAPINAK', name: 'Sensō-ji', area: 'Asakusa, Tokyo', photo: '#9B3A2A' },
        { id: 'meiji', cat: 'TAPINAK', name: 'Meiji Jingū', area: 'Shibuya, Tokyo', photo: '#4F7A4A' },
        { id: 'crossing', cat: 'MEYDAN', name: 'Shibuya Kavşağı', area: 'Shibuya, Tokyo', photo: '#3A4258' },
        { id: 'skytree', cat: 'MANZARA', name: 'Tokyo Skytree', area: 'Sumida, Tokyo', photo: '#5C6E86' },
        { id: 'tsukiji', cat: 'PAZAR', name: 'Tsukiji Dış Pazarı', area: 'Chūō, Tokyo', photo: '#A2452E' }
      ].map(row)
    };
  }
}
</script>
</body>
</html>
