<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kayıtlarım</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#222222;text-decoration:none}a:hover{color:#222222}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #222222; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="P-Ana.dc.html" aria-label="Geri" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<a href="N-YerEkle.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: underline">Veri aktar</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px">Kayıtlarım</h1>
<span style="font-size: 15px; color: #6A6A6A">Tokyo · Instagram, TikTok ve Google Maps'ten</span>
</div>
<div role="tablist" aria-label="Kaynak" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; align-content: start">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 138px; border-radius: 14px; background: {{it.photo}}">
<span style="position: absolute; left: 8px; top: 8px; height: 24px; padding: 0 9px; border-radius: 999px; background: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{it.src}}</span>
<button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.on}}" aria-label="{{it.aria}}" style="position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border-radius: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.2); background: {{it.btnBg}}; color: {{it.btnFg}}">
<sc-if value="{{it.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
<sc-if value="{{it.off}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></sc-if>
</button>
</div>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: #6A6A6A">{{it.cat}}</span>
<a href="P-Yer.dc.html" style="font-size: 15px; font-weight: 700; margin-top: -4px">{{it.name}}</a>
</div>
</sc-for>
</div>
<div style="height: 92px; flex: none; box-sizing: border-box; padding: 14px 24px 30px; background: #FFFFFF; border-top: 1px solid #EBEBEB; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 700">{{selTitle}}</span>
<span style="font-size: 13px; color: #6A6A6A">Gün otomatik seçilir</span>
</div>
<a href="P-Plan.dc.html" style="height: 48px; padding: 0 22px; border-radius: 8px; background: #C94A2B; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center">Rotaya ekle</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const src = s.src || 'all';
    const sel = s.sel || { ichiran: true, fuglen: true };
    const all = [
      { id: 'ichiran', name: 'Ichiran Shibuya', cat: 'RAMEN', src: 'Instagram', photo: '#8A4B2E' },
      { id: 'fuglen', name: 'Fuglen Tokyo', cat: 'KAFE', src: 'TikTok', photo: '#6B5A48' },
      { id: 'sensoji', name: 'Sensō-ji', cat: 'TAPINAK', src: 'Google Maps', photo: '#9B3A2A' },
      { id: 'teamlab', name: 'teamLab Planets', cat: 'MÜZE', src: 'Instagram', photo: '#3A4258' },
      { id: 'onibus', name: 'Onibus Coffee', cat: 'KAFE', src: 'Instagram', photo: '#7D6B55' },
      { id: 'tsukiji', name: 'Tsukiji Dış Pazarı', cat: 'PAZAR', src: 'Google Maps', photo: '#A2452E' },
      { id: 'afuri', name: 'Afuri Ebisu', cat: 'RAMEN', src: 'TikTok', photo: '#4F7A4A' },
      { id: 'yanaka', name: 'Yanaka Ginza', cat: 'SOKAK', src: 'Instagram', photo: '#6B6A4A' }
    ];
    const chips = [
      { id: 'all', label: 'Tümü 34' },
      { id: 'Instagram', label: 'Instagram 18' },
      { id: 'TikTok', label: 'TikTok 4' },
      { id: 'Google Maps', label: 'Google Maps 12' }
    ];
    const n = Object.keys(sel).filter((k) => sel[k]).length;
    return {
      chips: chips.map((c) => ({ ...c, on: c.id === src, bg: c.id === src ? '#222222' : '#FFFFFF', fg: c.id === src ? '#FFFFFF' : '#222222', border: c.id === src ? '1px solid #222222' : '1px solid #DDDDDD', pick: () => this.setState({ src: c.id }) })),
      items: all.filter((it) => src === 'all' || it.src === src).map((it) => ({
        ...it,
        on: !!sel[it.id],
        off: !sel[it.id],
        aria: sel[it.id] ? 'Rotadan çıkar' : 'Rotaya ekle',
        btnBg: sel[it.id] ? '#222222' : '#FFFFFF',
        btnFg: sel[it.id] ? '#FFFFFF' : '#222222',
        toggle: () => this.setState({ sel: { ...sel, [it.id]: !sel[it.id] } })
      })),
      selTitle: n === 0 ? 'Yer seç' : n + ' yer seçildi'
    };
  }
}
</script>
</body>
</html>
