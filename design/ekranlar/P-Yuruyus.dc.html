<span style="position: absolute; left: 290px; top: 330px; transform: translate(-50%, -50%); height: 34px; padding: 0 12px 0 4px; border-radius: 999px; background: #222222; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.25)"><span style="width: 26px; height: 26px; border-radius: 13px; background: #9B3A2A"></span>Sensō-ji</span>

<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1">80 m</span><span style="font-size: 13px; color: #6A6A6A">sonra sağa, Kaminarimon'a doğru</span></div>
</div>
<sc-if value="{{showToast}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 14px; background: #222222; color: #FFFFFF">
<span style="font-size: 14px">Sensō-ji'ye yaklaştın, anlatım başladı</span>
<button type="button" onClick="{{dismiss}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #FFFFFF; color: #222222; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Tamam</button>
</div>
</sc-if>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 100px; display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.1)">Sıradaki: Kappabashi · 18 dk</span>
<div style="padding: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.06), 0 6px 14px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="P-Yer.dc.html" style="flex: 1; display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; flex: none; border-radius: 12px; background: #9B3A2A"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Sensō-ji · Kaminarimon</span><span style="font-size: 13px; color: #6A6A6A">{{audioSub}}</span></span>
</a>
<button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 48px; height: 48px; flex: none; border-radius: 24px; border: none; background: #C94A2B; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></sc-if>
</button>
</div>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #EBEBEB; overflow: hidden"><div style="height: 3px; width: 39%; background: #222222"></div></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center">
<div role="tablist" aria-label="Mod" style="display: grid; grid-template-columns: 1fr 1fr; width: 200px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.06), 0 6px 14px rgba(0,0,0,0.08)">
<a role="tab" aria-selected="false" href="P-Plan.dc.html" style="height: 40px; border-radius: 999px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Planla</a>
<span role="tab" aria-selected="true" style="height: 40px; border-radius: 999px; background: #222222; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Yürü</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const playing = s.playing !== false;
    return {
      showToast: !s.dismissed,
      dismiss: () => this.setState({ dismissed: true }),
      playing: playing,
      paused: !playing,
      playLabel: playing ? 'Duraklat' : 'Dinle',
      audioSub: playing ? 'Anlatım çalıyor · 1:12 / 3:05' : 'Duraklatıldı · 1:12 / 3:05',
      toggle: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
