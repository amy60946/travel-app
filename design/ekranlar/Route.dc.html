<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Rota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C2381E;text-decoration:none}a:hover{color:#9E2C15}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #15171C; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 60px 20px 0">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.4px">Tokyo rotası</h1>
<span style="font-size: 14px; color: #5B6070">3 gün · Normal</span>
</div>
<div role="tablist" aria-label="Günler" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{dayTabs}}" as="d" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{d.on}}" onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 10px; border-radius: 12px; font: inherit; cursor: pointer; text-align: left; border: none; background: {{d.bg}}; color: {{d.fg}}">
<span style="font-size: 14px; font-weight: 700">{{d.title}}</span>
<span style="font-size: 12px">{{d.area}}</span>
</button>
</sc-for>
</div>
<div style="position: relative; height: 64px; flex: none; border-radius: 14px; overflow: hidden; background: #E7EAE3">
<div aria-hidden="true" style="position: absolute; left: -10px; right: -10px; top: 30px; height: 8px; background: #FFFFFF; transform: rotate(-6deg)"></div>
<div aria-hidden="true" style="position: absolute; left: 40px; top: 14px; width: 280px; height: 34px; border: 3px dashed #C2381E; border-radius: 30px; border-right-color: transparent"></div>
<span style="position: absolute; right: 10px; bottom: 8px; font-size: 12px; font-weight: 600; color: #15171C; background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 8px">{{dayInfo}}</span>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column">
<div style="display: flex; gap: 10px; align-items: center; padding: 8px 6px 8px 10px; border-radius: 14px; background: #FFFFFF">
<span style="width: 26px; height: 26px; flex: none; border-radius: 13px; background: #1D2740; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
<span style="font-size: 12px; color: #5B6070">{{s.meta}}</span>
</div>
<button type="button" onClick="{{s.remove}}" aria-label="Duraktan çıkar" style="width: 40px; height: 40px; border: none; background: transparent; color: #8A8F9C; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<span aria-label="Sürükleyerek sırala" style="width: 28px; height: 40px; color: #8A8F9C; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"></path></svg>
</span>
</div>
<span style="font-size: 12px; color: #5B6070; padding: 4px 0 4px 22px; border-left: 2px dotted #B8BCC6; margin-left: 22px">{{s.leg}}</span>
</div>
</sc-for>
</div>
<button type="button" onClick="{{lighten}}" style="flex: none; align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D5D8DE; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #15171C; cursor: pointer; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V6"></path><path d="M6 12l6-6 6 6"></path></svg>Günü hafiflet</button>
</div>
<div style="flex: none; padding: 10px 20px 12px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{showUndo}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 16px; border-radius: 14px; background: #15171C; color: #FFFFFF">
<span style="font-size: 14px">{{undoText}}</span>
<button type="button" onClick="{{undo}}" style="height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.14); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Geri al</button>
</div>
</sc-if>
<a href="Walk.dc.html" style="height: 54px; border-radius: 16px; background: #C2381E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(194,56,30,0.3)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>Yürüyüşe başla</a>
</div>
<nav aria-label="Sekmeler" style="height: 84px; flex: none; box-sizing: border-box; padding: 8px 8px 26px; background: #FFFFFF; border-top: 1px solid #E3E5EA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5B6070; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Gezim</a>
<a href="Route.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #C2381E; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"></path></svg>Rota</a>
<a href="Walk.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5B6070; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>Yürüyüş</a>
<a href="Download.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5B6070; font-size: 11px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>İndirilenler</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.days = [
      { title: '1. Gün', area: 'Asakusa · Ueno', stops: [
        { name: 'Sensō-ji', meta: 'Tapınak · 45 dk', leg: '6 dk yürüyüş · Nakamise sokağından' },
        { name: 'Kappabashi Sokağı', meta: 'Mutfak eşyası çarşısı · 30 dk', leg: '18 dk yürüyüş · ara sokaklardan' },
        { name: 'Ueno Parkı', meta: 'Park · 40 dk', leg: '12 dk yürüyüş' },
        { name: 'Yanaka Ginza', meta: 'Eski çarşı sokağı · 40 dk', leg: '10 dk yürüyüş · tapınak sokağından' },
        { name: 'Nezu Tapınağı', meta: 'Tapınak · 30 dk', leg: 'Günün sonu' }
      ] },
      { title: '2. Gün', area: 'Shinjuku · Shibuya', stops: [
        { name: 'Meiji Jingū', meta: 'Tapınak · 50 dk', leg: '15 dk yürüyüş' },
        { name: 'Takeshita Sokağı', meta: 'Alışveriş sokağı · 30 dk', leg: '20 dk yürüyüş · Cat Street üzerinden' },
        { name: 'Shibuya Kavşağı', meta: 'Meydan · 20 dk', leg: 'Tren önerisi: JR Yamanote, 7 dk' },
        { name: 'Omoide Yokochō', meta: 'Yemek sokağı · 60 dk', leg: 'Günün sonu' }
      ] },
      { title: '3. Gün', area: 'Chūō', stops: [
        { name: 'Tsukiji Dış Pazarı', meta: 'Pazar · 60 dk', leg: '15 dk yürüyüş' },
        { name: 'Hama-rikyū Bahçesi', meta: 'Bahçe · 45 dk', leg: 'Günün sonu' }
      ] }
    ];
    this.state = { day: 0, removed: [], undoText: '' };
  }
  renderVals() {
    const s = this.state;
    const day = this.days[s.day];
    const live = day.stops.filter((st) => s.removed.indexOf(s.day + ':' + st.name) < 0);
    const removeOne = (name, text) => this.setState({
      removed: s.removed.concat([s.day + ':' + name]),
      last: s.day + ':' + name,
      undoText: text
    });
    return {
      dayTabs: this.days.map((d, i) => ({
        title: d.title, area: d.area, on: i === s.day,
        bg: i === s.day ? '#1D2740' : '#FFFFFF',
        fg: i === s.day ? '#FFFFFF' : '#15171C',
        pick: () => this.setState({ day: i, undoText: '' })
      })),
      dayInfo: live.length + ' durak · yaklaşık 5 saat',
      stops: live.map((st, i) => ({
        ...st, n: i + 1,
        leg: i === live.length - 1 ? 'Günün sonu' : st.leg,
        remove: () => removeOne(st.name, st.name + ' çıkarıldı')
      })),
      lighten: () => { if (live.length > 1) removeOne(live[live.length - 1].name, 'Gün hafifletildi: ' + live[live.length - 1].name + ' çıkarıldı'); },
      showUndo: !!s.undoText,
      undoText: s.undoText,
      undo: () => this.setState({ removed: s.removed.filter((r) => r !== s.last), undoText: '' })
    };
  }
}
</script>
</body>
</html>
