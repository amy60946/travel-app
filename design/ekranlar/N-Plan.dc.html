<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gün ve tempo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#222222;text-decoration:none}a:hover{color:#222222}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #222222; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 22px">
<a href="N-Sehir.dc.html" aria-label="Geri" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #DDDDDD; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1">Tokyo'da kaç gün, hangi tempoda?</h1>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-top: 1px solid #EBEBEB; border-bottom: 1px solid #EBEBEB">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Gün</span>
<span style="font-size: 14px; color: #6A6A6A">Rota bu günlere bölünür</span>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" onClick="{{minus}}" aria-label="Bir gün azalt" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #B0B0B0; background: #FFFFFF; font: inherit; font-size: 20px; color: #222222; cursor: pointer">−</button>
<span style="font-size: 17px; font-weight: 600; min-width: 16px; text-align: center">{{days}}</span>
<button type="button" onClick="{{plus}}" aria-label="Bir gün artır" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #B0B0B0; background: #FFFFFF; font: inherit; font-size: 20px; color: #222222; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 16px; font-weight: 600">Tempo</span>
<sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: 14px; background: #FFFFFF; font: inherit; text-align: left; color: #222222; cursor: pointer; border: {{p.border}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 14px; color: #6A6A6A">{{p.desc}}</span>
</span>
<span style="font-size: 14px; font-weight: 600">{{p.stops}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-top: 1px solid #EBEBEB">
<span style="font-size: 16px; font-weight: 600">Anlatım dili</span>
<span style="font-size: 16px; text-decoration: underline">Türkçe</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 14px 24px 30px; background: #FFFFFF; border-top: 1px solid #EBEBEB; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 700">{{fitTitle}}</span>
<span style="font-size: 14px; color: #6A6A6A">24 yerinden</span>
</div>
<a href="N-Rota.dc.html" style="height: 48px; padding: 0 24px; border-radius: 8px; background: #C94A2B; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center">Rotayı hazırla</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const days = s.days || 3;
    const pace = s.pace || 'normal';
    const list = [
      { id: 'rahat', name: 'Rahat', desc: 'Az yürüyüş, içeri girmeye zaman', stops: 'günde 3-4', per: 4 },
      { id: 'normal', name: 'Normal', desc: 'Dengeli, 1-2 mola', stops: 'günde 5-6', per: 6 },
      { id: 'tempolu', name: 'Tempolu', desc: 'Çok yürüyüş, dışarıdan görüp geç', stops: 'günde 7+', per: 8 }
    ];
    const cur = list.find((p) => p.id === pace);
    return {
      days: days,
      minus: () => this.setState({ days: Math.max(1, days - 1) }),
      plus: () => this.setState({ days: Math.min(14, days + 1) }),
      paces: list.map((p) => ({ ...p, on: p.id === pace, border: p.id === pace ? '2px solid #222222' : '1px solid #DDDDDD', pick: () => this.setState({ pace: p.id }) })),
      fitTitle: Math.min(24, days * cur.per) + ' yer sığar'
    };
  }
}
</script>
</body>
</html>
